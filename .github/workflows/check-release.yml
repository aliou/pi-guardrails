name: Check release

# Do not run upstream release monitoring on the fork's schedule.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-release:
    # Enable only after choosing fork-owned release monitoring and issue behavior.
    if: ${{ false && github.repository == 'nmdra/pi-guardrails-classifier' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fork release monitoring is not configured
        run: echo "Release monitoring is disabled for nmdra/pi-guardrails-classifier."
